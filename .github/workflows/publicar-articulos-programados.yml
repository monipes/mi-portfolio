
name: Publicar artículos programados

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-articulos-programados
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar artículos cuya fecha ya llegó
        run: node scripts/publish-scheduled-articles.mjs

      - name: Guardar cambios y activar la nueva publicación
        run: |
          if git diff --quiet -- src/content/vision-alternativa; then
            echo "No hay artículos pendientes de publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/vision-alternativa
          git commit -m "Publicar artículos programados"
          git push origin HEAD:main

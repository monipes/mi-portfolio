backend:
  name: github
  repo: monipes/mi-portfolio
  branch: main
  base_url: https://misssam.online
  auth_endpoint: api/auth
media_folder: public/uploads
public_folder: /uploads
locale: es
collections:
- name: works
  label: Obras
  identifier_field: title_es
  folder: src/content/obras
  extension: md
  format: frontmatter
  create: true
  slug: '{{slug}}'
  summary: '{{title_es}} ({{year}})'
  fields:
  - name: published
    label: Publicada (visible en el sitio)
    widget: boolean
    default: true
  - name: added_at
    label: Fecha de incorporación (automática)
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DDTHH:mm:ssZ
    required: true
    hint: Se completa al crear la obra. No modificar; determina que las obras nuevas aparezcan primero.
  - name: featured
    label: Destacada en la página de inicio
    widget: boolean
    default: false
    hint: Activalo si querés que la obra aparezca en la sección de destacadas de la página de inicio.
  - name: featured_order
    label: Orden entre las obras destacadas (número menor = primero)
    widget: number
    required: false
    hint: Solo organiza las obras que estén marcadas como destacadas.
  - name: banner
    label: Incluir en el carrusel de la portada
    widget: boolean
    default: false
    hint: Activá esta opción para que la obra participe del carrusel de imágenes de la portada.
  - name: banner_order
    label: Posición en el carrusel (número menor = primero)
    widget: number
    required: false
    hint: Solo organiza las obras incluidas en el carrusel.
  - name: banner_y
    label: Encuadre vertical del banner (0 = arriba, 50 = centro, 100 = abajo)
    widget: number
    default: 55
    min: 0
    max: 100
    required: false
    hint: Ajusta qué parte de la imagen se ve en el banner; no modifica el archivo original.
  - name: category
    label: Carpeta / tipo de obra
    widget: select
    options:
    - label: Collage digital
      value: collage-digital
    - label: Collage animado
      value: collage-animado
  - name: title_es
    label: Título de la obra
    widget: string
  - name: desc_es
    label: Descripción en español
    widget: text
    required: false
    pattern:
    - ^.{0,110}$
    - Máximo 110 caracteres
    hint: Una frase breve sobre la obra. Máximo 110 caracteres.
  - name: image
    label: Imagen principal
    widget: image
  - name: focus
    label: Encuadre de la miniatura cuadrada (para obras verticales)
    widget: select
    options:
    - label: Arriba
      value: top
    - label: Centro
      value: center
    - label: Abajo
      value: bottom
    default: top
    required: false
    hint: Controla el recorte de la miniatura cuadrada; no modifica la imagen original.
  - name: alt_es
    label: Texto alternativo en español
    widget: string
  - name: gallery
    label: Imágenes adicionales de la obra
    widget: list
    required: false
    fields:
    - name: image
      label: Imagen principal
      widget: image
    - name: alt_es
      label: Texto alternativo en español
      widget: string
      required: false
  - name: year
    label: Año
    widget: number
    required: false
  - name: technique
    label: Técnica
    widget: string
  - name: size
    label: Medidas
    widget: string
    required: false
  - name: youtube
    label: ID de YouTube
    widget: string
    required: false
  - name: vimeo
    label: ID de Vimeo
    widget: string
    required: false
  - name: video_file
    label: Archivo de video MP4
    máx ~20MB): null
    widget: file
    required: false
  - name: buy_url
    label: Enlace de compra (si corresponde)
    un solo botón): null
    widget: string
    required: false
  - name: editions
    label: Ediciones a la venta (tamaños y precios, opcional)
    widget: list
    required: false
    fields:
    - name: label
      label: Tamaño o edición (ej. 30x40 cm - edición de 10)
      widget: string
    - name: price
      label: Precio (texto libre
      widget: string
      required: false
    - name: url
      label: Link de compra
      widget: string
      required: false
- name: ai_motion
  label: AI Motion
  identifier_field: title_es
  folder: src/content/ai-motion
  create: true
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  summary: '{{title_es}} · {{year}}'
  fields:
  - name: published
    label: Publicada (visible en el sitio)
    widget: boolean
    default: true
  - name: added_at
    label: Fecha de incorporación (automática)
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DDTHH:mm:ssZ
    required: true
    hint: Se completa al crear la obra. No modificar; determina que las obras nuevas aparezcan primero.
  - name: title_es
    label: Título de la obra
    widget: string
  - name: desc_es
    label: Descripción en español
    widget: text
    required: false
    hint: Una frase breve sobre la obra. Máximo 110 caracteres.
  - name: year
    label: Año
    widget: number
    required: false
  - name: technique
    label: Técnica
    widget: string
    required: false
    default: AI Motion
  - name: cover
    label: Imagen de portada (opcional)
    widget: image
    required: false
  - name: video_file
    label: Archivo de video MP4
    widget: file
    required: false
  - name: youtube
    label: ID de YouTube
    widget: string
    required: false
  - name: vimeo
    label: ID de Vimeo
    widget: string
    required: false
  - name: alt_es
    label: Texto alternativo en español
    widget: string
    required: false
- name: vision_alternativa
  label: Visión Alternativa
  folder: src/content/vision-alternativa
  create: true
  identifier_field: title_es
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  summary: '{{title_es}} · {{date}}'
  fields:
  - name: published
    label: Publicada (visible en el sitio)
    widget: boolean
    default: true
  - name: date
    label: Fecha de publicación
    widget: datetime
    date_format: DD/MM/YYYY
    time_format: false
    format: YYYY-MM-DD
  - name: publish_at
    label: Programar publicación (hora de Argentina)
    widget: datetime
    date_format: DD/MM/YYYY
    time_format: true
    format: YYYY-MM-DDTHH:mm:ssZ
    required: false
    hint: Si se completa, el artículo se publica automáticamente en esa fecha y hora.
  - name: reading_time
    label: Tiempo de lectura (minutos, opcional)
    widget: number
    required: false
    value_type: int
    min: 1
    hint: Dejar vacío para calcularlo automáticamente.
  - name: title_es
    label: Título de la obra
    widget: string
  - name: excerpt_es
    label: Bajada breve del artículo
    widget: text
  - name: category
    label: Carpeta / tipo de obra
    widget: select
    options:
    - Arte digital
    - Surrealismo
    - Animación experimental
    - Cultura visual
    - Tecnología y creatividad
    - Artistas
  - name: tags
    label: Etiquetas
    widget: list
    required: false
    field:
      name: tag
      label: Etiqueta
      widget: string
  - name: image
    label: Imagen principal
    widget: image
  - name: alt_es
    label: Texto alternativo en español
    widget: string
  - name: seo_title_es
    label: Título para Google (SEO)
    widget: string
    required: false
  - name: seo_description_es
    label: Descripción para Google (SEO)
    widget: text
    required: false
  - name: body_es
    label: Texto del artículo
    widget: text
- name: expos
  label: Exposiciones
  identifier_field: title_es
  folder: src/content/exposiciones
  extension: md
  format: frontmatter
  create: true
  summary: '{{start}} · {{title_es}}'
  fields:
  - name: start
    label: Fecha (2022-07-28 · o 2022-12 si solo sabés el mes · o 2025 si solo el año)
    widget: string
  - name: title_es
    label: Título de la obra
    widget: string
  - name: venue
    label: Lugar / sala
    widget: string
  - name: address
    label: Dirección
    widget: string
    required: false
  - name: city_es
    label: Ciudad
    widget: string
    required: false
  - name: country_es
    label: País
    widget: string
    required: false
  - name: desc_es
    label: Descripción en español
    widget: text
    required: false
    hint: Una frase breve sobre la obra. Máximo 110 caracteres.
  - name: image
    label: Imagen principal
    widget: image
    required: false
  - name: alt_es
    label: Texto alternativo en español
    widget: string
    required: false
  - name: work
    label: Obra tuya que se mostró (opcional)
    widget: relation
    collection: works
    search_fields:
    - title_es
    value_field: '{{slug}}'
    display_fields:
    - title_es
    required: false
  - name: works
    label: Más obras o videos de esta exposición (aparecen como botones)
    widget: list
    required: false
    field:
      name: obra
      label: Obra o video
      widget: relation
      collection: works
      search_fields:
      - title_es
      value_field: '{{slug}}'
      display_fields:
      - title_es
  - name: url
    label: Link con más información
    widget: string
    required: false
  - name: youtube
    label: ID de YouTube
    widget: string
    required: false
  - name: vimeo
    label: ID de Vimeo
    widget: string
    required: false
  - name: video_file
    label: Archivo de video MP4
    widget: file
    required: false
  - name: video_poster
    label: Imagen de portada del video subido (opcional)
    widget: image
    required: false
- name: portada
  label: Portada de inicio
  files:
  - name: portada
    label: Textos y video de la portada
    file: src/data/portada.json
    fields:
    - name: expo_text_es
      label: Texto del bloque Exposiciones (ES)
      widget: text
    - name: expo_image
      label: Imagen del bloque Exposiciones (mejor vertical)
      widget: image
      required: false
    - name: expo_alt_es
      label: Descripción de esa imagen (ES)
      widget: string
      required: false
    - name: video_vimeo
      label: ID de Vimeo del video
      widget: string
      required: false
    - name: video_youtube
      label: ID de YouTube del video (si no es Vimeo)
      widget: string
      required: false
    - name: video_title_es
      label: Título del video (ES)
      widget: string
    - name: video_year
      label: Año del video
      widget: string
      required: false
    - name: video_desc_es
      label: De qué trata el video (ES)
      widget: text
      required: false
    - name: video2_file
      label: Segundo video - archivo mp4 subido (aparece debajo del primero)
      widget: file
      required: false
    - name: video2_poster
      label: Segundo video - imagen de portada
      widget: image
      required: false
    - name: video2_title_es
      label: Segundo video - título (ES)
      widget: string
      required: false
    - name: video2_year
      label: Segundo video - año
      widget: string
      required: false
    - name: video2_desc_es
      label: Segundo video - de qué trata (ES)
      widget: text
      required: false
  - name: acerca
    label: Acerca de (biografía)
    file: src/data/acerca.json
    fields:
    - name: bio_es
      label: Biografía (ES)
      widget: text
    - name: photo
      label: Foto tuya (opcional)
      widget: image
      required: false
    - name: photo_alt_es
      label: Descripción de la foto (ES)
      widget: string
      required: false

- name: google_analytics
  label: Google Analytics
  files:
  - name: measurement
    label: Medición de MISS SAM
    file: src/data/analytics.json
    fields:
    - name: measurement_id
      label: ID de medición de Google Analytics (G-...)
      widget: string
      required: false
      hint: Pegá solamente el identificador que empieza con G-. No pegues el código HTML completo ni un ID GTM-.

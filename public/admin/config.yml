backend:
  name: github
  repo: TU-USUARIO-GITHUB/TU-REPO
  branch: main
  base_url: https://TU-PROYECTO.pages.dev   # login con GitHub (ver guía paso 5)
media_folder: public/uploads
public_path: /uploads
locale: es
collections:
  - name: works
    label: Obras
    folder: src/content/obras
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title_es}} ({{year}})"
    fields:
      - {name: published, label: Publicada, widget: boolean, default: true}
      - {name: featured, label: Destacada en la home, widget: boolean, default: false}
      - {name: hero, label: Banner de la home - la que aparece primero (solo una), widget: boolean, default: false}
      - {name: banner, label: Banner de la home - mostrar en el banner que va pasando (usá las de mejor calidad), widget: boolean, default: false}
      - {name: banner_y, label: Banner - qué parte se ve (0 = arriba, 50 = centro, 100 = abajo), widget: number, default: 55, min: 0, max: 100, required: false}
      - {name: order, label: Orden (número chico = primero), widget: number, default: 50}
      - {name: category, label: Carpeta, widget: select, options: [{label: Collage digital, value: collage-digital},{label: Collage animado, value: collage-animado}]}
      - {name: title_es, label: Título (ES), widget: string}
      - {name: title_en, label: Título (EN), widget: string, required: false}
      - {name: title_pt, label: Título (PT-BR), widget: string, required: false}
      - {name: desc_es, label: Descripción (ES), widget: text, required: false}
      - {name: desc_en, label: Descripción (EN), widget: text, required: false}
      - {name: desc_pt, label: Descripción (PT-BR), widget: text, required: false}
      - {name: image, label: Imagen principal (JPG o PNG, hasta ~3000 px), widget: image}
      - {name: focus, label: En la grilla cuadrada, qué parte se ve (para obras verticales), widget: select, options: [{label: Arriba, value: top},{label: Centro, value: center},{label: Abajo, value: bottom}], default: top, required: false}
      - {name: alt_es, label: Texto alternativo (ES) - describe la imagen, widget: string}
      - {name: alt_en, label: Texto alternativo (EN), widget: string, required: false}
      - {name: alt_pt, label: Texto alternativo (PT-BR), widget: string, required: false}
      - name: gallery
        label: Más imágenes
        widget: list
        required: false
        fields: [{name: image, label: Imagen, widget: image},{name: alt_es, label: Alt (ES), widget: string, required: false},{name: alt_en, label: Alt (EN), widget: string, required: false},{name: alt_pt, label: Alt (PT), widget: string, required: false}]
      - {name: year, label: Año, widget: number, required: false}
      - {name: technique, label: Técnica, widget: string}
      - {name: size, label: Medidas, widget: string, required: false}
      - {name: youtube, label: ID de YouTube (ej. dQw4w9WgXcQ), widget: string, required: false}
      - {name: vimeo, label: ID de Vimeo (ej. 123456789), widget: string, required: false}
      - {name: video_file, label: Video subido (mp4 corto, máx ~20MB), widget: file, required: false}
      - {name: buy_url, label: Link a la tienda (si la obra se vende, un solo botón), widget: string, required: false}
      - name: editions
        label: Ediciones a la venta (tamaños y precios, opcional)
        widget: list
        required: false
        fields: [{name: label, label: Tamaño o edición (ej. 30x40 cm - edición de 10), widget: string},{name: price, label: Precio (texto libre, ej. USD 120), widget: string, required: false},{name: url, label: Link de compra, widget: string, required: false}]
  - name: expos
    label: Exposiciones
    folder: src/content/exposiciones
    extension: md
    format: frontmatter
    create: true
    fields:
      - {name: title_es, label: Nombre (ES), widget: string}
      - {name: title_en, label: Nombre (EN), widget: string, required: false}
      - {name: title_pt, label: Nombre (PT-BR), widget: string, required: false}
      - {name: desc_es, label: Descripción (ES), widget: text, required: false}
      - {name: desc_en, label: Descripción (EN), widget: text, required: false}
      - {name: desc_pt, label: Descripción (PT-BR), widget: text, required: false}
      - {name: venue, label: Lugar, widget: string}
      - {name: city, label: Ciudad, widget: string}
      - {name: start, label: Desde, widget: string}
      - {name: end, label: Hasta, widget: string, required: false}
      - {name: url, label: Link, widget: string, required: false}
      - {name: image, label: Imagen, widget: image, required: false}
  - name: portada
    label: Portada de inicio
    files:
      - name: portada
        label: Textos y video de la portada
        file: src/data/portada.json
        fields:
          - {name: phrase_es, label: Frase debajo del banner (ES), widget: string}
          - {name: phrase_en, label: Frase (EN), widget: string, required: false}
          - {name: phrase_pt, label: Frase (PT-BR), widget: string, required: false}
          - {name: expo_text_es, label: Texto del bloque Exposiciones (ES), widget: text}
          - {name: expo_text_en, label: Texto Exposiciones (EN), widget: text, required: false}
          - {name: expo_text_pt, label: Texto Exposiciones (PT-BR), widget: text, required: false}
          - {name: expo_image, label: Imagen del bloque Exposiciones (mejor vertical), widget: image, required: false}
          - {name: expo_alt_es, label: Descripción de esa imagen (ES), widget: string, required: false}
          - {name: video_vimeo, label: ID de Vimeo del video, widget: string, required: false}
          - {name: video_youtube, label: ID de YouTube del video (si no es Vimeo), widget: string, required: false}
          - {name: video_title_es, label: Título del video (ES), widget: string}
          - {name: video_title_en, label: Título (EN), widget: string, required: false}
          - {name: video_title_pt, label: Título (PT-BR), widget: string, required: false}
          - {name: video_year, label: Año del video, widget: string, required: false}
          - {name: video_desc_es, label: De qué trata el video (ES), widget: text, required: false}
          - {name: video_desc_en, label: De qué trata (EN), widget: text, required: false}
          - {name: video_desc_pt, label: De qué trata (PT-BR), widget: text, required: false}
      - name: acerca
        label: Acerca de (biografía)
        file: src/data/acerca.json
        fields:
          - {name: bio_es, label: Biografía (ES), widget: text}
          - {name: bio_en, label: Biografía (EN), widget: text, required: false}
          - {name: bio_pt, label: Biografía (PT-BR), widget: text, required: false}
          - {name: photo, label: Foto tuya (opcional), widget: image, required: false}
          - {name: photo_alt_es, label: Descripción de la foto (ES), widget: string, required: false}
